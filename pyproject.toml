[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-excited-elm"
version = "0.1.0"
description = "Extreme-learning-machine modelling of flat-plate self-excited aerodynamic forces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
